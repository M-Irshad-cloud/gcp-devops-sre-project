teps:
    - name: "python:3.12-slim"
          entrypoint: bash
                args:
                        - -c
                                - |
                                          pip install --no-cache-dir -r app/requirements.txt --break-system-packages || pip install -r app/requirements.txt
                                                  python -c "
                                                          import sys, os
                                                                  sys.path.insert(0, 'app')
                                                                          import main
                                                                                  c = main.app.test_client()
                                                                                          assert c.get('/health').status_code == 200
                                                                                                  assert c.get('/orders').status_code == 200
                                                                                                          print('Smoke tests passed')
                                                                                                                  "

                                                                                                                    - name: "gcr.io/cloud-builders/docker"
                                                                                                                          args:
                                                                                                                                  - build
                                                                                                                                          - "-t"
                                                                                                                                                  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:$SHORT_SHA"
                                                                                                                                                          - "./app"

                                                                                                                                                              - name: "gcr.io/cloud-builders/docker"
                                                                                                                                                                    args:
                                                                                                                                                                            - push
                                                                                                                                                                                    - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:$SHORT_SHA"

                                                                                                                                                                                        - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
                                                                                                                                                                                              entrypoint: gcloud
                                                                                                                                                                                                    args:
                                                                                                                                                                                                            - run
                                                                                                                                                                                                                    - deploy
                                                                                                                                                                                                                            - "${_SERVICE_NAME}"
                                                                                                                                                                                                                                    - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:$SHORT_SHA"
                                                                                                                                                                                                                                            - "--region=${_REGION}"
                                                                                                                                                                                                                                                    - "--platform=managed"
                                                                                                                                                                                                                                                            - "--allow-unauthenticated"

                                                                                                                                                                                                    images:
                                                                                                                                                                                                        - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:$SHORT_SHA"

                                                                                                                                                                                                    options:
                                                                                                                                                                                                        logging: CLOUD_LOGGING_ONLY
